<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Logo oficina legal</title>
  <desc id="desc">Logo con las letras AC doradas sobre fondo negro, con texto Lic. Álvaro Calderón y Abogado y Notario.</desc>
  <rect width="1200" height="900" fill="#10161d"/>

  <g fill="#d7b56b" font-family="Georgia, 'Times New Roman', serif">
    <text x="260" y="420" font-size="430" font-weight="500" letter-spacing="-18">A</text>
    <text x="575" y="420" font-size="430" font-weight="500" letter-spacing="-18">C</text>

    <text x="160" y="590" font-size="118" font-weight="700" letter-spacing="2">LIC. ÁLVARO</text>
    <text x="160" y="700" font-size="118" font-weight="700" letter-spacing="2">CALDERÓN</text>
    <text x="330" y="810" font-size="58" font-weight="700" letter-spacing="5">ABOGADO Y NOTARIO</text>
  </g>
</svg>
